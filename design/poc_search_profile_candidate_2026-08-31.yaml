retrieval_principles:
  - "字面關鍵字只負責部分召回，不是唯一入口。"
  - "文章標題沒有 Primary Keyword，但正文主旨與主題／專案／事件類型實質相關時，必須保留召回機會。"
  - "Semantic Expansion 只提高召回率；最終是否收錄仍由 G4 業務相關性判斷。"
  - "一次性使用者 override 不自動修改永久 Profile。"
  - "TW100 不逐站全掃，依主題與 source tags 建 active_source_set。"

negative_condition_candidates:
  status: "PENDING_TEAM_CALIBRATION"
  items:
    - id: finance_investment
      rule: "主要目的為投資、股價或個股解讀時排除；若事件本身直接影響政府科技政策則例外評估。"
    - id: gaming_consumer
      rule: "純遊戲、消費電子或新品開箱排除。"
    - id: election_noise
      rule: "純選舉或政黨攻防排除；正式政府政策／制度變更仍可評估。"
    - id: vendor_marketing
      rule: "純廠商自我宣傳降權；若有具體政府部署、驗證、政策或可比較案例可再評估。"

handoff_note: |
  此檔是 2026-08-31 將分散於 Overview／討論／既有 topic_profile 的搜尋設計收斂成單一可校正候選。
  它尚未取代兩平台 topic_profile.yaml。
  下一步應在業務校正後，明確 merge 到 Claude/ChatGPT 兩 lane 並做 diff/static validation，再進 Internal PoC。
