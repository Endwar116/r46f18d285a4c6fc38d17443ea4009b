meta:
  version: "0.6.0-rc1"
  candidate_patch: "source-coverage-expansion-2026-08-26"
  authority: "single topic/search/source profile"
  purpose: "今天找什麼、為什麼找、查詢優先序與來源覆蓋。"
  source_registry: "source_registry_taiwan.yaml"
  source_note: "本 callable 版本只保留可執行需求，不攜帶內部人物與訪談來源。"

principles:
  - "先找高雄資訊處既有專案與公部門直接影響，再擴大到技術、主流媒體、產業、地方、同業城市與社群訊號。"
  - "搜尋詞與來源 registry 只負責召回候選，最終收錄由 decision_policy.yaml 決定。"
  - "不逐一硬查 100 個來源。依 topic tags、來源類別與 rotation 選出本次 active source set。"
  - "每個 query 獨立搜尋，不把不同主題串成超長 query。"
  - "標題沒有關鍵字仍可收。正文主旨只是帶到關鍵字仍須排除。"
  - "論壇、社群、聚合器是 signal lane，不是預設 final evidence。"

primary_keywords:
  verified: [資安, AI, 市民卡, 數位發展部, 智慧城市]
  caution:
    AI: "容易召回美股、投資與產品行銷，必須走 Q3/Q4 與雜訊規則。"

expansion_vocabulary:
  infosec:
    status: "PENDING_CONFIRM"
    terms: [資通安全, 資安法, 駭客攻擊, 勒索軟體, 個資外洩, 資料外洩, 零信任, 弱點掃描, 資安通報, 國家資通安全研究院, 供應鏈攻擊, SBOM, EDR, SOC, CVE]
  ai:
    status: "CANDIDATE_REVIEW"
    terms: [生成式AI, AI Agent, Agentic AI, 多模態AI, VLM, AI治理, AI採購, AI安全, AI資料治理, 主權AI, AI基礎設施]
  smartcity:
    status: "CANDIDATE_REVIEW"
    terms: [智慧交通, 智慧路燈, 開放資料, 數位治理, 公部門數位轉型, 城市儀表板, 數位孿生, 智慧防災, 智慧治安, 城市韌性]
  local:
    status: "PENDING_CONFIRM"
    terms: [高雄市政府 資訊, 高雄 智慧城市, 高雄 資安, 高雄 AI, 高雄 數位市民, 亞灣 AIoT]

scope:
  infosec:
    include: ["公部門或關鍵基礎設施資安事件。", "資安法規、政策、標準更新。", "具體漏洞、攻擊手法與防禦技術。", "國內外重大資料外洩且對公部門有可說明影響。", "具體且可信的資安社群早期訊號，供後續驗證。"]
  ai:
    include: ["政府採用生成式 AI 的政策與案例。", "AI 治理、法規與安全要求。", "對公務部署有實質影響的 AI 技術進展。", "公部門可比較的資料治理、Agent、模型評測與基礎設施案例。"]
  smartcity:
    status: "CANDIDATE_REVIEW"
    include_domains:
      city_ai_governance: [主權AI, 城市級AI, VLM, AI治理, 城市治理AI, 決策輔助]
      digital_public_service: [高雄數位市民, 數位身分, 行動申辦, 單一入口, 市政支付, 數位服務]
      city_data_infrastructure: [跨局處資料整合, API, 地理資訊共通平台, 數位孿生, 城市資料平台, 大數據]
      resilient_city: [智慧防災, 災害管理, 水利監測, 設施異常, 城市韌性, 預警]
      smart_mobility: [智慧交通, 交通疏運, 交通預測, MaaS, 車路協同]
      smart_public_safety: [智慧治安, 詐騙預警, 消防救災, 智慧防溺, 影像辨識]
      smart_industry_and_aiot: [5G AIoT, 亞灣, AI產業應用, 智慧製造, 新創驗證]
      digital_resilience: [雲端機房, 混合雲, 資訊韌性, 備援, 資安治理]
      international_smart_city: [智慧城市展, 國際城市交流, OASC, 城市合作, 國際獎項]
    exclude: ["只有 AI／智慧城市字樣的企業行銷、股價或消費產品。", "無公部門、城市治理或高雄專案關聯的純國外產品發表。", "沒有政策、部署、治理或城市應用資訊的泛科技評論。"]

