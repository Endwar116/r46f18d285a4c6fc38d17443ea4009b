query_planner:
  always_run: [P0]
  normally_run: [P1]
  conditional:
    P2: "P0/P1 不足、某分類空白，或有與高雄既有專案可直接比較的新案例時。"
    P3: "TW100 source coverage expansion 後仍低於 target_min 時只作補漏。"
  budget: {P0: 16, P1: 10, P2: 6, P3: 4, max_total: 32}
  source_aware_planning:
    registry: "source_registry_taiwan.yaml"
    active_source_set: "依本次 topic tags 從 100-source registry 選來源，不逐站全掃。"
    core_lane: "A_OFFICIAL/A_INSTITUTION/B_PROFESSIONAL/B_RESEARCH 優先。"
    editorial_lane: "C/D 類以主題相關性與近期未覆蓋程度輪替。"
    signal_lane: "論壇、社群、聚合器在候選不足、突發訊號或使用者指定時啟用。"
    tool_strategy: "工具支援 domains filter 時以多來源 domain batch 搜尋。若不支援，僅對優先來源使用 site: 查詢，不得 100 站逐站硬查。"
    coverage_floor: "每次 run 至少覆蓋官方/專業、主流/產業、地方/同業城市三種來源帶。"
  history_aware: ["近 3 天已高密度發布、且沒有新增事實的事件避免泛化重搜。", "一次人工刪除不自動形成永久負向規則。", "長期追蹤議題只收新增事實。", "source rotation 優先補最近數次未覆蓋但與當日 topic 相符的來源。"]
  output_fields: [query, priority, category, rationale, related_project, source_lane, source_ids, fallback_of]

source_priority:
  authority: "source_registry_taiwan.yaml"
  rule: "來源等級決定搜尋角色、證據用途與同事件選源，不直接替代 Q3/Q4。"
  tiers:
    A_primary: {score: 5, role: "官方／研究一手來源"}
    B_professional: {score: 4, role: "科技／資安／研究專業來源"}
    C_mainstream: {score: 3, role: "主流與編輯媒體"}
    D_context: {score: 2, role: "產業、公民與同業城市補充來源"}
    S_signal: {score: 1, role: "論壇／社群／聚合器，只負責訊號召回或需交叉驗證"}
  kcg_official_extensions:
    - {name: 高雄智慧城市建設資訊, url: "https://smartcity.kcg.gov.tw/", weight: 110}
    - {name: 高雄市政府資訊處, url: "https://dpc.kcg.gov.tw/", weight: 110}
    - {name: 高雄市政府全球資訊網, url: "https://www.kcg.gov.tw/", weight: 100}

benchmark_baselines:
  manual:
    cost: "約 30–60 分鐘至 1 小時／日，作為既有人工流程量級參考。"
    volume: "約 20 則／日屬既有人工量級，仍待實際五日 yield 校正。"
    observed_behavior: "逐則點閱、人工篩選、週一回翻歷史避免重複。"
  google_alert: "已試用但結果仍有舊聞與雜訊。"
  internal_crawler: "已有科內工具實驗，但即時性與穩定性仍有限制。"