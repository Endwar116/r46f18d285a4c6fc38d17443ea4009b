meta:
  version: "0.6.0-rc1"
  patch: "poc-calibration-g1-g7-output-2026-08-27"
  efficiency_patch: "runtime-efficiency-2026-08-31"
  purpose: "把承辦可決定的日期、目標則數、分類與輸出格式集中成 PoC 校正面。"
  status: "DRAFT_FOR_INTERNAL_POC"

principles:
  - "業務參數由承辦／Irene／專案團隊校正，Skill 不替使用者默默決定。"
  - "G1 在搜尋開始前固定本次日期範圍與目標新聞總則數。"
  - "G7 只檢查是否達到 G1 已設定的目標，以及交付欄位是否完整；不得在最後一刻自行改目標。"
  - "數量不足時可以擴大來源或依允許的時間階梯補搜，但不得降低來源、事實、去重與摘要品質。"

run_scope:
  date_mode:
    default: "TODAY"
    allowed: [TODAY, LAST_48_HOURS, LAST_72_HOURS, CUSTOM]
    owner: "承辦／專案團隊"
    note: "TODAY 預設以 Asia/Taipei 當下時間決定今日範圍；若不足可依 runtime 時間階梯補搜。"

  target_total_count:
    value: 8
    status: "CALIBRATED_FROM_OBSERVED_YIELD_2026-08-31"
    owner: "承辦"
    overridable_per_run: true
    prompt_when_missing: "今天希望最後看到幾則新聞？"
    ask_policy: "DO_NOT_ASK_WHEN_VALUE_PRESENT"
    calibration_basis: |
      依 runtime.yaml > yield_telemetry.observed_runs 及 2026-08-27 實測：
      未帶時間錨點的兩次 run，T1 命中為 0。
      帶錨點後，2 條 P0 query 得 1 則 T1 命中。
      16 條 P0 保守外推（扣除同事件去重、G4 淘汰、日期驗證失敗，係數 0.5）約得 T1 4 則。
      故預設 8 則＝T1 約 4 則 + T2 補足，多數日子不需擴展到 T3。
    rationale: |
      先前 value 為 null，導致每次執行都必須先問一次才能開始，多一輪往返。
      且若沿用 12–15 則的直覺值，依實測必然每次跑滿 T1→T2→T3 三層階梯，
      這是單次執行耗時過長的主因之一。
      本值為可覆寫預設，承辦說「今天要 15 則」時以當次為準，不改寫本檔。
    review_trigger: "累積 5 個工作日 yield telemetry 後重新校正。"

  target_band_split:
    standard_target: "AUTO_QUALITY_FIRST"
    candidate_target: "FILL_REMAINDER_WITHOUT_PADDING"
    owner: "承辦可另行指定"
    rule: "先放合標準新聞；候選新聞補足資訊面與剩餘目標，但不得把排除項目升級。"
    expected_split_at_default: "合標準 3–5 則、候選新聞 3–5 則。實際比例由當日召回決定，不得為湊比例升級排除項目。"

user_facing_gates:
  G0: "執行準備"
  G1: "日期與目標則數"
  G2: "來源與證據"
  G3: "具體事實"
  G4: "業務相關性"
  G5: "重複判斷"
  G6: "摘要忠實度"
  G7: "數量與交付完整度"
  G8: "人工確認"

legacy_gate_mapping:
  note: "既有 regression 與部分 runtime 仍使用 Q0-Q8。PoC 對外統一顯示 G0-G8；待 regression migration 後再移除 legacy alias。"
  Q0: G0
  Q1: G1
  Q2: G2
  Q3: G3
  Q4: G4
  Q5: G5
  Q6: G6
  Q7: G7
  Q8: G8

selection_display:
  qualified:
    internal_alias: CORE
    display_label: "合標準"
    meaning: "直接符合目前業務相關性與品質標準。"
  candidate:
    internal_alias: EXTENDED
    display_label: "候選新聞"
    meaning: "具延伸、比較、前瞻或追蹤價值，交由承辦決定是否採用。"
  excluded:
    internal_alias: EXCLUDE
    display_label: "排除"

item_output_contract:
  required_fields: [title, summary, url]
  summary_length_zh_chars:
    min: 50
    max: 100
  title_rule: "保留原始新聞標題，不自行改寫。"
  url_rule: "使用可開啟的完整原文連結。"

final_output_contract:
  section_order: [qualified, candidate, daily_overall_summary]
  show_section_counts: true
  daily_overall_summary:
    label: "今日總摘要"
    max_zh_chars: 250
    rule: "只整理本次合標準＋候選新聞共同趨勢，不新增來源沒有的事實。"
  degraded_rule: "未達 target_total_count 時，照實顯示實際則數與補搜範圍，不硬湊。"
