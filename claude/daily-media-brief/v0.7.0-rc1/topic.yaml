# ⚠ 查詢設計原則（2026-08-31 實測後改版）
#
# 1. 不放日期字串。
#    實測：「數發部 AI 詐騙 四大平台」得 4 則今日；「數發部 AI 8月31日」只得 1 則今日，
#    其餘是投資網、活動截止日、論壇——全因字串含「8月31日」被吸進來。
#    新舊過濾用搜尋回傳的 age 欄位，在回應端做，不在查詢端做。
#
# 2. 每條都要有台灣專屬實體名稱。
#    實測：「8月31日AI新聞」回來全部是日本新聞。
#    Claude 搜尋工具沒有台灣區域設定，「數發部」「資安署」「高市府」這種詞就是在幫它定位。
#
# 3. 用新聞慣用簡稱，不用正式全名。
#    數發部 ≠ 數位發展部，資安署 ≠ 資通安全署。新聞標題用簡稱。
#
# 4. 不加泛用名詞。
#    「政策」「事件」「資訊」「漏洞」這類詞不幫助召回，只稀釋實體訊號。
#
# 5. 新增查詢前先跑一次，確認回傳前 5 則至少 1 則 age < 72h。
#    沒有就不要放進來。

queries:
  p0:
    # 每日容器，展開後可得 5 則，必查
    - "iThome 資安日報"
    # 中央部會（新聞簡稱）
    - "數發部 AI"
    - "數發部 資安"
    - "數發部 詐騙"
    - "資安署 通報"
    - "資安院 政府"
    - "TWCERT 漏洞"
    # 高雄（新聞簡稱）
    - "高市府 AI"
    - "高市府 資訊處"
    - "高雄 智慧城市"
    - "高雄 市民卡"
    - "高雄 主權AI"
    # 跨域（用「台灣」定位）
    - "台灣 政府 資安事件"
    - "台灣 公務機關 生成式AI"
    - "台灣 市政府 智慧城市"
    - "台灣 MyData"
  p1:
    - "中央社 AI"
    - "中央社 資安"
    - "台灣 AI Agent 資安"
    - "台灣 零信任 政府"
