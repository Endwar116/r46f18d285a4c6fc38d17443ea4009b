# G4 相關性評分（≥ 5 合標準，3–4 候選，≤ 2 排除）
relevance:
  直接命中資訊處專案: 6
  高雄市府城市治理專案: 5
  影響政府的国家政策或資安規定: 5
  對公部門有意義的重大資安事件或漏洞: 5
  同業城市可比較案例: 3
  有明確政府部署影響的AI技術變化: 3
  泛談AI或智慧城市: 0
  投資股市為主: -6
  選舉政黨攻防為主: -6
  純消費產品: -5
  純廠商行銷: -4
  論壇意見: -6
