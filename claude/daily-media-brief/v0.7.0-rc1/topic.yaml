    - "台灣 數位孿生 市政府"
    - "高雄 數位轉型"
    - "高雄 物聯網"

# 回應端新舊過濾
recency_filter:
  rule: "搜尋回傳每則都有 age 欄位。先用 age 初篩，超過當前時間階層的直接排除，不開原文。"
  note: "age 只是初篩。進入合標準或候選前，發布日期仍須依 SKILL.md G2 規則驗證。"
  no_age: "無 age 欄位的結果先保留，進候選後開原文確認。"

