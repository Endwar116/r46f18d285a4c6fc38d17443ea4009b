scan_strategy:
  objective: "增加同日有效候選的召回率，不把 100 個來源逐一硬查。"
  daily_core_classes: [A_OFFICIAL, A_INSTITUTION, B_PROFESSIONAL, B_RESEARCH]
  rotating_classes: [C_MAINSTREAM, C_EDITORIAL, C_BUSINESS, D_BUSINESS, D_PUBLIC_MEDIA, D_CIVIC, D_PEER_GOV]
  signal_classes: [B_COMMUNITY_PRO, C_AGGREGATOR, S_SIGNAL_ONLY]
  rules:
    - "先依 topic tags 選來源，再產生 query。"
    - "每次 run 至少覆蓋官方/專業、主流/商業、地方/同業城市三種來源帶。"
    - "論壇、社群、聚合器只作 signal lane；除非貼文本身就是事件，否則不可單獨作最終事實來源。"
    - "若 signal lane 出現高頻同事件，回到 A/B/C/D 可驗證來源找原文或交叉證據。"
    - "同一事件若已有高階來源，不因來源池擴大而重複增加則數。"