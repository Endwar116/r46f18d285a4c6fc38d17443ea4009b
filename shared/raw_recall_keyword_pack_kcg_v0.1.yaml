raw_query_templates:
  primary_direct:
    - "{date_zh} {term} 新聞"
  primary_local_boost:
    - "{date_zh} 高雄 {term}"
  related:
    - "{date_zh} {term} 新聞 台灣"
  project:
    - "{date_zh} {term}"
  broad:
    - "{date_zh} AI 新聞 台灣"
    - "{date_zh} 人工智慧 台灣"
    - "{date_zh} 資安 新聞 台灣"
