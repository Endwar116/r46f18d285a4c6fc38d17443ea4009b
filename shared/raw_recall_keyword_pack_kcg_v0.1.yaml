execution_rules:
  - "每個 Primary Keyword 至少被一條 direct query 覆蓋。"
  - "Alias 可補搜，但不能讓 Primary Keyword 本身完全沒被搜。"
  - "Related terms 是受控擴展，不允許執行模型自行無限擴寫。"
  - "Raw Lane 只做最小去重／日期清理，不做最終相關性判斷。"
  - "Raw 結果要帶 matched_terms 與 query_origin，方便正式流程追蹤來源。"
  - "若查詢成本受限，先保留所有 Primary Keyword direct coverage，再縮 related/project budget。"

handoff:
